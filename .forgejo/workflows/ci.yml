name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: codeberg-small
    # The official Node image already contains git and npm, so the checkout
    # action and the project scripts can run without a setup step.
    container:
      image: node:22-bookworm
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The artifact must keep working from a subpath (Codeberg Pages serves a
      # project site under /<repo>/). Relative asset URLs are easy to lose.
      - name: Serve the build from a subpath
        run: |
          PREFIX=KnowledgeWeb node .tooling/serve-dist.mjs &
          sleep 1
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:4190/KnowledgeWeb/
          asset=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          curl --fail --silent --show-error -o /dev/null "http://127.0.0.1:4190/KnowledgeWeb/$asset"
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:4190/KnowledgeWeb/manifest.webmanifest
